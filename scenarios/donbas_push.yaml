turn_limit: 30

briefing:
  title: "DONBAS — PHASE LINE BRAVO"
  situation: |
    Friendly mechanized forces have broken through the first defensive belt
    east of Kramatorsk and are pushing toward Phase Line BRAVO. Enemy air
    defenses are thinning but a forward SA-21 battery remains active near
    Objective KILO. Air superiority over the engagement zone is contested,
    with enemy fighter-bomber elements still operating from forward bases.
  mission: |
    Establish air superiority over the declared engagement zone east of
    Phase Line ALPHA, then push ground formations to seize Objective KILO.
    Time is critical — exploitation window closes in 20 turns before enemy
    reserves arrive.
  rules_of_engagement: |
    Weapons free in declared engagement zone east of Phase Line ALPHA.
    Restricted Target List in effect for civilian infrastructure: bridges,
    power plants, and hospitals OFF LIMITS. Cluster munitions prohibited.

phases:
  - name: "Phase I: SEAD"
    description: "Suppress enemy air defenses to clear the way for offensive air ops."
    objectives:
      - { label: "Detect SA-21 site", kind: "recon", target_ids: ["red-missile_launcher-1"] }
      - { label: "Destroy SA-21 site", kind: "destroy", target_ids: ["red-missile_launcher-1"] }
  - name: "Phase II: Air Superiority"
    description: "Defeat enemy fighter and strike-drone threat."
    objectives:
      - { label: "Destroy enemy fighter", kind: "destroy", target_ids: ["red-fighter-1"] }
      - { label: "Destroy enemy bomber", kind: "destroy", target_ids: ["red-bomber-1"] }
      - { label: "Destroy enemy strike drone", kind: "destroy", target_ids: ["red-strike_drone-1"] }
  - name: "Phase III: Push"
    description: "Advance ground formations to Objective KILO."
    objectives:
      - { label: "Move armor to Objective KILO", kind: "transit", target_ids: ["blue-armor-1"], target_hex: [11, 1] }
      - { label: "Move infantry to Objective KILO", kind: "transit", target_ids: ["blue-infantry-1"], target_hex: [11, 1] }
      - { label: "Seize red base", kind: "destroy", target_ids: ["red-base-1"] }

