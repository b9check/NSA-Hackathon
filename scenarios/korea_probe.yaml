name: "Korea Probe"
seed: 220511
turn_limit: 30

briefing:
  title: "DMZ PROBE — DEFENSIVE ACTION"
  situation: |
    Reconnaissance assets have identified a hostile probe force massing north
    of the DMZ at Kaesong. Intent appears to be a limited-objective
    reconnaissance-in-force aimed at the FLOT (forward line of own troops)
    near Munsan. Civilian population centers lie 22km south of the FLOT.
    Allied early warning radars are degraded after a SIGINT incident last
    week; ground picket assets must compensate.
  mission: |
    On order, ROK/US combined forces will establish a defensive picket
    forward of Phase Line ALPHA, identify hostile intent, and intercept any
    breaching elements before they threaten civilian areas. Hold until
    reinforcements arrive at turn 15.
  rules_of_engagement: |
    Defensive only. No fires across the MDL. Engage only on positive ID of
    hostile intent (weapons free upon crossing of Phase Line ALPHA, or upon
    being engaged). All engagements must be reported within 10 minutes.

phases:
  - name: "Phase I: Detect"
    description: "Establish radar coverage and identify the probe force composition."
    objectives:
      - { label: "Activate forward radar picket", kind: "recon" }
      - { label: "Identify probe force lead element", kind: "recon", target_ids: ["red-scout_drone-1"] }
  - name: "Phase II: Intercept"
    description: "Engage hostile elements before they cross Phase Line ALPHA."
    objectives:
      - { label: "Deny crossing at Phase Line ALPHA", kind: "deny", target_hex: [10, 7] }
      - { label: "Destroy probe lead armor", kind: "destroy", target_ids: ["red-armor-1"] }
      - { label: "Destroy probe infantry", kind: "destroy", target_ids: ["red-infantry-1", "red-infantry-2"] }
  - name: "Phase III: Hold"
    description: "Defend friendly base until reinforcements arrive (turn 15)."
    objectives:
      - { label: "Hold blue base until turn 15", kind: "hold", target_ids: ["blue-base-1"] }

