name: "Hormuz Transit"
seed: 110723
turn_limit: 30

briefing:
  title: "HORMUZ TRANSIT — DAY 0"
  situation: |
    A U.S. carrier strike group (CSG-12) has been ordered to transit the
    Strait of Hormuz to reassure allies and maintain freedom of navigation.
    Tensions with Iran have escalated over the past 72 hours; cease-fire
    negotiations in Muscat collapsed yesterday. Iranian SA-21 batteries near
    Bandar Abbas are at full readiness, and IRGC-AF fighter cover has been
    surged to Bandar Abbas Airbase. The transit window opens in 18 hours.
  mission: |
    CSG-12 will provide air cover for the strait transit and neutralize
    active SAM threats prior to entry of the transit window. Establish local
    air superiority, then escort capital ships through the strait with
    minimal damage. Friendly losses must remain below 30% combat power.
  rules_of_engagement: |
    Weapons free against actively emitting threats. Positive identification
    required for non-emitter targets. Civilian shipping in TSS lanes is OFF
    LIMITS. Hot pursuit into Iranian territorial waters authorized for
    self-defense only.

phases:
  - name: "Phase I: Suppress Air Defenses"
    description: "Detect and neutralize active SA-21 batteries covering the transit lane."
    objectives:
      - { label: "Detect SA-21 emitters near Bandar Abbas", kind: "recon" }
      - { label: "Neutralize SA-21 site (red-missile_launcher-1)", kind: "destroy", target_ids: ["red-missile_launcher-1"] }
  - name: "Phase II: Establish Air Superiority"
    description: "Defeat IRGC-AF fighter cover and clear the air corridor."
    objectives:
      - { label: "Destroy enemy fighter cover", kind: "destroy", target_ids: ["red-fighter-1"] }
      - { label: "Destroy enemy strike drone", kind: "destroy", target_ids: ["red-strike_drone-1"] }
  - name: "Phase III: Transit"
    description: "Move the destroyer through the strait with combat power above 70%."
    objectives:
      - { label: "Transit destroyer to objective hex", kind: "transit", target_ids: ["blue-destroyer-1"], target_hex: [3, 2] }

